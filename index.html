<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUT OF 6 | Cover-Quiz (GUeRiLLaZ Edition)</title>
</head>
<body style="margin: 0; padding: 10px; background: #0a0a0a;">

<div id="outof6-app" style="font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 900px; margin: 10px auto; background: #121212; color: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #282828; padding-bottom: 15px; margin-bottom: 20px;">
        <h2 style="margin: 0; color: #1DB954; letter-spacing: 1px;">OUT OF 6 <span style="font-size: 14px; color: #b3b3b3; font-weight: normal;">| Cover-Quiz</span></h2>
        <div id="player-status" style="font-size: 12px; color: #1DB954;">● Bereit (Kein Login nötig)</div>
    </div>

    <div id="screen-setup">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 20px;">
            <div style="background: #181818; padding: 18px; border-radius: 12px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #1DB954;">1. Playlist wählen oder suchen</label>
                <select id="select-playlist" style="width: 100%; padding: 10px; border-radius: 6px; background: #282828; color: #fff; border: 1px solid #404040; margin-bottom: 12px; font-size: 14px;"></select>
                <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                    <input type="text" id="input-search-playlist" placeholder="Nach Thema suchen (z.B. 80s, Rock)..." style="flex: 1; padding: 9px; border-radius: 6px; background: #282828; color: #fff; border: 1px solid #404040; font-size: 13px;">
                    <button id="btn-search-playlist" type="button" style="background: #333; color: #fff; border: 1px solid #555; padding: 0 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">🔍</button>
                </div>
                <input type="text" id="custom-playlist-url" placeholder="Oder Deezer Playlist-Link / ID einfügen..." style="width: 100%; box-sizing: border-box; padding: 9px; border-radius: 6px; background: #282828; color: #fff; border: 1px solid #404040; font-size: 13px;">
                <div id="search-status" style="font-size: 12px; color: #b3b3b3; margin-top: 6px;"></div>
            </div>

            <div style="background: #181818; padding: 18px; border-radius: 12px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #1DB954;">2. Spielregeln</label>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-size: 14px;">Spielmodus:</span>
                    <select id="select-mode" style="width: 155px; padding: 6px; border-radius: 6px; background: #282828; color: #fff; border: 1px solid #404040; font-size: 13px;">
                        <option value="normal" selected>Normal (1 Cover/Artist)</option>
                        <option value="expert">Experte (Selber Artist)</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-size: 14px;">Anzahl Runden:</span>
                    <input type="number" id="input-rounds" value="6" min="1" max="20" style="width: 65px; padding: 6px; border-radius: 6px; background: #282828; color: #fff; border: 1px solid #404040; text-align: center;">
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-size: 14px;">Covers pro Runde:</span>
                    <select id="select-covers" style="width: 75px; padding: 6px; border-radius: 6px; background: #282828; color: #fff; border: 1px solid #404040;">
                        <option value="4">4</option>
                        <option value="6" selected>6</option>
                        <option value="8">8</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 14px;">Anzahl Spieler:</span>
                    <input type="number" id="input-player-count" value="2" min="1" max="8" style="width: 65px; padding: 6px; border-radius: 6px; background: #282828; color: #fff; border: 1px solid #404040; text-align: center;">
                </div>
            </div>
        </div>

        <div style="background: #181818; padding: 18px; border-radius: 12px; margin-bottom: 25px;">
            <label style="display: block; font-weight: bold; margin-bottom: 12px; color: #1DB954;">3. Spielernamen eintragen</label>
            <div id="player-names-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px;"></div>
        </div>

        <div style="text-align: center;">
            <button id="btn-start-game" type="button" style="background: #1DB954; color: #000; border: none; padding: 15px 40px; font-size: 18px; border-radius: 30px; cursor: pointer; font-weight: bold;">
                Spiel starten
            </button>
            <p id="setup-error" style="color: #ff5555; font-size: 13px; margin-top: 10px;"></p>
        </div>
    </div>
    <!-- 2. GAME SCREEN -->
    <div id="screen-game" style="display: none;">
        <div id="scoreboard" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center;"></div>

        <div style="background: #181818; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; border-left: 4px solid #1DB954;">
            <div id="round-indicator" style="font-size: 13px; color: #b3b3b3; text-transform: uppercase; letter-spacing: 1px;">Runde 1 von 6</div>
            <div id="turn-indicator" style="font-size: 22px; font-weight: bold; margin: 5px 0;">Spieler 1 ist dran!</div>
            <div style="margin-top: 8px; display: flex; justify-content: center; gap: 10px; align-items: center;">
                <button id="btn-replay-song" type="button" style="background: #282828; color: #fff; border: 1px solid #404040; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer;">
                    🔊 Hörprobe erneut abspielen
                </button>
                <span id="audio-playing-badge" style="font-size: 12px; color: #1DB954;">♪ Musik läuft...</span>
            </div>
        </div>

        <div id="covers-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 20px;"></div>

        <div id="feedback-box" style="display: none; background: #181818; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #333;">
            <div id="feedback-title" style="font-size: 20px; font-weight: bold; margin-bottom: 6px;"></div>
            <div id="feedback-song" style="font-size: 15px; color: #e0e0e0; margin-bottom: 15px;"></div>
            <button id="btn-next-turn" type="button" style="background: #1DB954; color: #000; border: none; padding: 12px 28px; font-size: 15px; border-radius: 25px; cursor: pointer; font-weight: bold;">
                Weiter ➔
            </button>
        </div>
    </div>

    <!-- 3. WINNER SCREEN -->
    <div id="screen-winner" style="display: none; text-align: center; padding: 30px 15px;">
        <div style="font-size: 50px; margin-bottom: 10px;">🏆</div>
        <h2 id="winner-name" style="color: #1DB954; font-size: 28px; margin: 0 0 10px 0;">Gewinner!</h2>
        <p style="color: #b3b3b3; margin-bottom: 25px;">Endstand der Runde:</p>
        <div id="final-standings" style="max-width: 400px; margin: 0 auto 30px auto; background: #181818; padding: 15px; border-radius: 12px;"></div>
        <button id="btn-restart" type="button" style="background: #1DB954; color: #000; border: none; padding: 14px 32px; font-size: 16px; border-radius: 30px; cursor: pointer; font-weight: bold;">
            Neues Spiel / Menü
        </button>
    </div>

    <div style="margin-top: 25px; padding-top: 12px; border-top: 1px solid #282828; text-align: center; font-size: 11px; color: #777;">
        KA-2 OUT OF 6 | Kuratiert von GUeRiLLaZ | Musik-Vorschauen & Album-Cover via Deezer API.
    </div>
</div>

<!-- Lädt deine kuratierten Playlists aus der separaten catalog.js -->
<script src="catalog.js"></script>
<script>
(function() {
    let audioPlayer = new Audio();
    audioPlayer.crossOrigin = 'anonymous';
    let trackPool = [];
    let currentPlaylistId = null;
    let sessionShownAlbumIds = new Set();
    let gameConfig = { mode: 'normal', rounds: 6, coverCount: 6, players: [] };
    let gameState = { currentRound: 1, currentPlayerIndex: 0, isTiebreaker: false, tiebreakerRound: 0, currentCorrectTrack: null, hasAnswered: false };

    const screens = {
        setup: document.getElementById('screen-setup'),
        game: document.getElementById('screen-game'),
        winner: document.getElementById('screen-winner')
    };
    const showScreen = function(name) {
        Object.values(screens).forEach(function(s) { s.style.display = 'none'; });
        screens[name].style.display = 'block';
    };

    const shuffleArray = function(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const temp = copy[i];
            copy[i] = copy[j];
            copy[j] = temp;
        }
        return copy;
    };

    const fetchDeezerJSONP = function(endpoint) {
        return new Promise(function(resolve, reject) {
            const callbackName = 'dz_cb_' + Math.round(100000 * Math.random());
            const script = document.createElement('script');
            const separator = endpoint.includes('?') ? '&' : '?';
            const timeout = setTimeout(function() { cleanup(); reject(new Error('Zeitüberschreitung bei Deezer.')); }, 10000);
            function cleanup() {
                clearTimeout(timeout);
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
            }
            window[callbackName] = function(data) {
                cleanup();
                if (data && data.error) reject(new Error(data.error.message || 'Deezer API Fehler'));
                else resolve(data);
            };
            
script.src = 'https://' + 'api.' + 'deezer.com' + endpoint + separator + 'output=jsonp&callback=' + callbackName; 
            script.onerror = function() { cleanup(); reject(new Error('Netzwerkfehler.')); };
            document.body.appendChild(script);
        });
    };

    let audioCtx = null;
    const unlockAudio = function() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) {}
    };

    const playSound = function(type) {
        try {
            unlockAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.12);
                osc.frequency.setValueAtTime(783.99, now + 0.24);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
                osc.start(now);
                osc.stop(now + 0.55);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.35);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        } catch (e) {}
    };
    const populatePlaylistDropdown = function(searchResults) {
        const select = document.getElementById('select-playlist');
        select.innerHTML = '';

        const catalog = window.GUERILLAZ_CATALOG || {};
        const curatedGroup = document.createElement('optgroup');
        curatedGroup.label = '★ GUeRiLLaZ Kuratierte Playlists';
        Object.keys(catalog).forEach(function(key) {
            const opt = document.createElement('option');
            opt.value = 'gz:' + key;
            opt.textContent = catalog[key].name;
            curatedGroup.appendChild(opt);
        });
        select.appendChild(curatedGroup);

        if (searchResults && searchResults.length > 0) {
            const searchGroup = document.createElement('optgroup');
            searchGroup.label = '🔍 Deezer Suchergebnisse';
            searchResults.forEach(function(pl) {
                const opt = document.createElement('option');
                opt.value = 'dz:' + pl.id;
                opt.textContent = pl.title + ' (' + pl.nb_tracks + ' Songs)';
                searchGroup.appendChild(opt);
            });
            select.appendChild(searchGroup);
            select.value = 'dz:' + searchResults[0].id;
        }
    };

    const searchPlaylists = async function() {
        const query = document.getElementById('input-search-playlist').value.trim();
        const statusEl = document.getElementById('search-status');
        if (!query) return;
        statusEl.innerText = 'Suche Playlists zu "' + query + '"...';
        try {
            const data = await fetchDeezerJSONP('/search/playlist?q=' + encodeURIComponent(query) + '&limit=15');
            if (data.data && data.data.length > 0) {
                const valid = data.data.filter(function(p) { return p.nb_tracks >= 10; });
                populatePlaylistDropdown(valid);
                statusEl.innerText = valid.length + ' Playlists gefunden und oben ausgewählt.';
            } else {
                statusEl.innerText = 'Keine Playlists gefunden. Bitte anderen Begriff testen.';
            }
        } catch (e) {
            statusEl.innerText = 'Suchfehler: ' + e.message;
        }
    };

    document.getElementById('btn-search-playlist').addEventListener('click', searchPlaylists);
    document.getElementById('input-search-playlist').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchPlaylists();
    });

    const renderPlayerInputs = function() {
        const count = Math.min(8, Math.max(1, parseInt(document.getElementById('input-player-count').value) || 1));
        const container = document.getElementById('player-names-container');
        const existingValues = Array.from(container.querySelectorAll('input')).map(function(i) { return i.value; });
        container.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Spieler ' + (i + 1);
            input.value = existingValues[i] || ('Spieler ' + (i + 1));
            input.style.cssText = 'padding: 10px; border-radius: 6px; background: #282828; color: #fff; border: 1px solid #404040; font-size: 14px;';
            container.appendChild(input);
        }
    };
    document.getElementById('input-player-count').addEventListener('change', renderPlayerInputs);
    const extractDeezerPlaylistId = function(input) {
        if (!input) return null;
        const match = input.match(/playlist\/(\d+)/);
        if (match && match[1]) return match[1];
        if (/^\d+$/.test(input.trim())) return input.trim();
        return null;
    };

    const loadDeezerPlaylistTracks = async function(playlistId, statusCallback) {
        let allTracks = [];
        let index = 0;
        const limit = 100;
        let hasMore = true;
        while (hasMore && allTracks.length < 1000) {
            statusCallback('Lade Songs aus Deezer-Playlist (' + allTracks.length + ' geladen)...');
            const data = await fetchDeezerJSONP('/playlist/' + playlistId + '/tracks?index=' + index + '&limit=' + limit);
            if (!data || !data.data || data.data.length === 0) hasMore = false;
            else {
                allTracks = allTracks.concat(data.data);
                index += limit;
                if (!data.next) hasMore = false;
            }
        }
        return allTracks.filter(function(t) {
            return t && t.id && t.preview && t.preview.length > 5 && t.album && (t.album.cover_big || t.album.cover_medium);
        });
    };

    const resolveCuratedTrack = async function(pair) {
        const q = 'artist:"' + pair[1] + '" track:"' + pair[0] + '"';
        try {
            let data = await fetchDeezerJSONP('/search?q=' + encodeURIComponent(q) + '&limit=3');
            if (!data || !data.data || data.data.length === 0) {
                data = await fetchDeezerJSONP('/search?q=' + encodeURIComponent(pair[0] + ' ' + pair[1]) + '&limit=3');
            }
            if (data && data.data) {
                const valid = data.data.find(function(t) {
                    return t && t.id && t.preview && t.preview.length > 5 && t.album && (t.album.cover_big || t.album.cover_medium);
                });
                return valid || null;
            }
        } catch (e) {}
        return null;
    };

    const loadCuratedCatalogTracks = async function(catalogKey, statusCallback) {
        const catalog = window.GUERILLAZ_CATALOG || {};
        const entry = catalog[catalogKey];
        if (!entry) throw new Error('Katalog-Playlist nicht gefunden.');
        const needed = Math.min(entry.tracks.length, Math.max(40, gameConfig.rounds * gameConfig.players.length * 2 + 20));
        const sample = shuffleArray(entry.tracks).slice(0, needed);
        const resolved = [];
        const batchSize = 6;
        for (let i = 0; i < sample.length; i += batchSize) {
            statusCallback('Bereite Songs vor (' + resolved.length + ' / ' + needed + ')...');
            const batch = sample.slice(i, i + batchSize);
            const results = await Promise.all(batch.map(resolveCuratedTrack));
            results.forEach(function(r) { if (r) resolved.push(r); });
            if (resolved.length >= gameConfig.rounds * gameConfig.players.length + gameConfig.coverCount + 6) break;
        }
        return resolved;
    };
    const getPlayedIds = function(playlistId) {
        try {
            const raw = localStorage.getItem('outof6_dz_played_' + playlistId);
            return raw ? new Set(JSON.parse(raw)) : new Set();
        } catch (e) { return new Set(); }
    };
    const savePlayedId = function(playlistId, trackId) {
        try {
            const set = getPlayedIds(playlistId);
            set.add(trackId);
            localStorage.setItem('outof6_dz_played_' + playlistId, JSON.stringify(Array.from(set)));
        } catch (e) {}
    };
    const resetPlayedIds = function(playlistId) {
        try { localStorage.removeItem('outof6_dz_played_' + playlistId); } catch (e) {}
    };

    document.getElementById('btn-start-game').addEventListener('click', async function() {
        const errorEl = document.getElementById('setup-error');
        errorEl.innerText = '';
        unlockAudio();
        audioPlayer.play().catch(function() {});
        audioPlayer.pause();

        const customUrl = document.getElementById('custom-playlist-url').value.trim();
        const selectVal = document.getElementById('select-playlist').value;
        const mode = document.getElementById('select-mode').value;
        const rounds = Math.max(1, parseInt(document.getElementById('input-rounds').value) || 6);
        const coverCount = parseInt(document.getElementById('select-covers').value) || 6;
        const nameInputs = document.querySelectorAll('#player-names-container input');

        gameConfig = {
            mode: mode,
            rounds: rounds,
            coverCount: coverCount,
            players: Array.from(nameInputs).map(function(inp, idx) {
                return { name: inp.value.trim() || ('Spieler ' + (idx + 1)), score: 0, activeInTiebreaker: true };
            })
        };

        try {
            if (customUrl) {
                const dzId = extractDeezerPlaylistId(customUrl);
                if (!dzId) { errorEl.innerText = 'Bitte einen gültigen Deezer-Link oder eine ID eingeben.'; return; }
                currentPlaylistId = 'dz_' + dzId;
                trackPool = await loadDeezerPlaylistTracks(dzId, function(m) { errorEl.innerText = m; });
            } else if (selectVal.startsWith('gz:')) {
                const gzKey = selectVal.slice(3);
                currentPlaylistId = 'gz_' + gzKey;
                trackPool = await loadCuratedCatalogTracks(gzKey, function(m) { errorEl.innerText = m; });
            } else if (selectVal.startsWith('dz:')) {
                const dzId = selectVal.slice(3);
                currentPlaylistId = 'dz_' + dzId;
                trackPool = await loadDeezerPlaylistTracks(dzId, function(m) { errorEl.innerText = m; });
            }

            if (trackPool.length < coverCount) {
                errorEl.innerText = 'Zu wenig abspielbare Songs gefunden (mindestens ' + coverCount + ' benötigt).';
                return;
            }

            sessionShownAlbumIds.clear();
            gameState = { currentRound: 1, currentPlayerIndex: 0, isTiebreaker: false, tiebreakerRound: 0, currentCorrectTrack: null, hasAnswered: false };
            errorEl.innerText = '';
            showScreen('game');
            startTurn();
        } catch (e) {
            errorEl.innerText = 'Fehler beim Laden: ' + e.message;
        }
    });

    const playPreview = function(previewUrl) {
        const badge = document.getElementById('audio-playing-badge');
        audioPlayer.pause();
        audioPlayer.src = previewUrl;
        audioPlayer.currentTime = 0;
        badge.innerText = '♪ Hörprobe läuft...';
        badge.style.color = '#1DB954';
        audioPlayer.play().catch(function() {
            badge.innerText = 'Tippe auf "Hörprobe erneut abspielen"';
            badge.style.color = '#ffcc00';
        });
    };

    audioPlayer.onended = function() {
        const badge = document.getElementById('audio-playing-badge');
        badge.innerText = 'Hörprobe beendet';
        badge.style.color = '#b3b3b3';
    };

    document.getElementById('btn-replay-song').addEventListener('click', function() {
        if (gameState.currentCorrectTrack) playPreview(gameState.currentCorrectTrack.preview);
    });
    const buildExpertChoices = async function(correctTrack) {
        const choices = [{ id: correctTrack.id, albumId: correctTrack.album.id, cover: correctTrack.album.cover_big || correctTrack.album.cover_medium, isCorrect: true }];
        const usedAlbums = new Set([correctTrack.album.id]);
        if (correctTrack.artist && correctTrack.artist.id) {
            try {
                const data = await fetchDeezerJSONP('/artist/' + correctTrack.artist.id + '/albums?limit=30');
                if (data && data.data) {
                    const albums = shuffleArray(data.data);
                    for (let i = 0; i < albums.length; i++) {
                        if (choices.length >= gameConfig.coverCount) break;
                        const alb = albums[i];
                        if (alb && alb.id && !usedAlbums.has(alb.id) && (alb.cover_big || alb.cover_medium)) {
                            usedAlbums.add(alb.id);
                            choices.push({ id: -alb.id, albumId: alb.id, cover: alb.cover_big || alb.cover_medium, isCorrect: false });
                        }
                    }
                }
            } catch (e) {}
        }
        if (choices.length < gameConfig.coverCount) {
            const fallback = shuffleArray(trackPool);
            for (let i = 0; i < fallback.length; i++) {
                if (choices.length >= gameConfig.coverCount) break;
                const cand = fallback[i];
                if (!usedAlbums.has(cand.album.id)) {
                    usedAlbums.add(cand.album.id);
                    choices.push({ id: cand.id, albumId: cand.album.id, cover: cand.album.cover_big || cand.album.cover_medium, isCorrect: false });
                }
            }
        }
        return shuffleArray(choices);
    };

    const buildNormalChoices = function(correctTrack) {
        const choices = [{ id: correctTrack.id, albumId: correctTrack.album.id, cover: correctTrack.album.cover_big || correctTrack.album.cover_medium, isCorrect: true }];
        const usedAlbumIds = new Set([correctTrack.album.id]);
        const usedArtistKeys = new Set([(correctTrack.artist && correctTrack.artist.name ? correctTrack.artist.name : '').toLowerCase().trim()]);

        const unseen = shuffleArray(trackPool.filter(function(t) { return !sessionShownAlbumIds.has(t.album.id); }));
        const seen = shuffleArray(trackPool.filter(function(t) { return sessionShownAlbumIds.has(t.album.id); }));
        const orderedPool = unseen.concat(seen);

        for (let i = 0; i < orderedPool.length; i++) {
            if (choices.length >= gameConfig.coverCount) break;
            const cand = orderedPool[i];
            const artistKey = (cand.artist && cand.artist.name ? cand.artist.name : '').toLowerCase().trim();
            if (!usedAlbumIds.has(cand.album.id) && (!artistKey || !usedArtistKeys.has(artistKey))) {
                usedAlbumIds.add(cand.album.id);
                if (artistKey) usedArtistKeys.add(artistKey);
                sessionShownAlbumIds.add(cand.album.id);
                choices.push({ id: cand.id, albumId: cand.album.id, cover: cand.album.cover_big || cand.album.cover_medium, isCorrect: false });
            }
        }
        return shuffleArray(choices);
    };

    const startTurn = async function() {
        gameState.hasAnswered = false;
        document.getElementById('feedback-box').style.display = 'none';
        renderScoreboard();

        const currentPlayer = gameConfig.players[gameState.currentPlayerIndex];
        document.getElementById('round-indicator').innerText = gameState.isTiebreaker
            ? ('⚡ STECHEN – Runde ' + gameState.tiebreakerRound)
            : ('Runde ' + gameState.currentRound + ' von ' + gameConfig.rounds);
        document.getElementById('turn-indicator').innerText = currentPlayer.name + ' ist dran!';

        const playedSet = getPlayedIds(currentPlaylistId);
        let availableTracks = trackPool.filter(function(t) { return !playedSet.has(t.id); });
        if (availableTracks.length === 0) {
            resetPlayedIds(currentPlaylistId);
            availableTracks = trackPool.slice();
        }

        const correctTrack = availableTracks[Math.floor(Math.random() * availableTracks.length)];
        savePlayedId(currentPlaylistId, correctTrack.id);
        sessionShownAlbumIds.add(correctTrack.album.id);
        gameState.currentCorrectTrack = correctTrack;

        const roundChoices = (gameConfig.mode === 'expert')
            ? await buildExpertChoices(correctTrack)
            : buildNormalChoices(correctTrack);

        renderCovers(roundChoices);
        playPreview(correctTrack.preview);
    };
    const renderCovers = function(items) {
        const grid = document.getElementById('covers-grid');
        grid.innerHTML = '';
        items.forEach(function(item) {
            const card = document.createElement('div');
            card.dataset.isCorrect = item.isCorrect ? '1' : '0';
            card.style.cssText = 'cursor: pointer; border-radius: 10px; overflow: hidden; border: 4px solid transparent; transition: transform 0.15s, border-color 0.2s; background: #181818; aspect-ratio: 1 / 1;';
            const img = document.createElement('img');
            img.src = item.cover;
            img.alt = 'Album Cover';
            img.style.cssText = 'width: 100%; height: 100%; object-fit: cover; display: block;';
            card.appendChild(img);
            card.addEventListener('mouseenter', function() { if (!gameState.hasAnswered) card.style.transform = 'scale(1.03)'; });
            card.addEventListener('mouseleave', function() { card.style.transform = 'scale(1)'; });
            card.addEventListener('click', function() { handleGuess(item, card); });
            grid.appendChild(card);
        });
    };

    const handleGuess = function(selectedItem, clickedCard) {
        if (gameState.hasAnswered) return;
        gameState.hasAnswered = true;
        const isCorrect = selectedItem.isCorrect;
        const currentPlayer = gameConfig.players[gameState.currentPlayerIndex];

        const allCards = document.querySelectorAll('#covers-grid > div');
        allCards.forEach(function(card) {
            card.style.cursor = 'default';
            if (card.dataset.isCorrect === '1') {
                card.style.borderColor = '#1DB954';
                card.style.boxShadow = '0 0 20px rgba(29, 185, 84, 0.7)';
            } else if (card === clickedCard && !isCorrect) {
                card.style.borderColor = '#ff4444';
                card.style.opacity = '0.6';
            } else {
                card.style.opacity = '0.45';
            }
        });

        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackSong = document.getElementById('feedback-song');
        const artistName = gameState.currentCorrectTrack.artist ? gameState.currentCorrectTrack.artist.name : 'Unbekannt';
        const albumTitle = gameState.currentCorrectTrack.album ? gameState.currentCorrectTrack.album.title : '';

        if (isCorrect) {
            currentPlayer.score += 1;
            playSound('win');
            feedbackTitle.innerHTML = '<span style="color: #1DB954;">✔ Richtig! +1 Punkt für ' + currentPlayer.name + '</span>';
        } else {
            playSound('lose');
            feedbackTitle.innerHTML = '<span style="color: #ff5555;">✘ Leider falsch!</span>';
        }

        feedbackSong.innerHTML = 'Gesucht: <strong>' + gameState.currentCorrectTrack.title + '</strong> – ' + artistName + (albumTitle ? ' <span style="color:#999;">(' + albumTitle + ')</span>' : '');
        document.getElementById('feedback-box').style.display = 'block';
        renderScoreboard();
    };

    document.getElementById('btn-next-turn').addEventListener('click', function() {
        let nextIndex = gameState.currentPlayerIndex + 1;
        while (nextIndex < gameConfig.players.length && !gameConfig.players[nextIndex].activeInTiebreaker) {
            nextIndex++;
        }
        if (nextIndex < gameConfig.players.length) {
            gameState.currentPlayerIndex = nextIndex;
            startTurn();
            return;
        }
        if (!gameState.isTiebreaker) {
            if (gameState.currentRound < gameConfig.rounds) {
                gameState.currentRound++;
                gameState.currentPlayerIndex = 0;
                startTurn();
            } else {
                evaluateGameEnd();
            }
        } else {
            evaluateGameEnd();
        }
    });

    const evaluateGameEnd = function() {
        const maxScore = Math.max.apply(null, gameConfig.players.map(function(p) { return p.score; }));
        const leaders = gameConfig.players.filter(function(p) { return p.score === maxScore; });
        if (leaders.length === 1) {
            audioPlayer.pause();
            showWinnerScreen(leaders);
        } else {
            gameState.isTiebreaker = true;
            gameState.tiebreakerRound += 1;
            gameConfig.players.forEach(function(p) { p.activeInTiebreaker = (p.score === maxScore); });
            gameState.currentPlayerIndex = gameConfig.players.findIndex(function(p) { return p.activeInTiebreaker; });
            startTurn();
        }
    };

    const renderScoreboard = function() {
        const board = document.getElementById('scoreboard');
        board.innerHTML = '';
        gameConfig.players.forEach(function(p, idx) {
            const isCurrent = idx === gameState.currentPlayerIndex;
            const badge = document.createElement('div');
            badge.style.cssText = 'padding: 8px 16px; border-radius: 20px; font-size: 14px; ' +
                'background: ' + (isCurrent ? '#1DB954' : '#282828') + '; ' +
                'color: ' + (isCurrent ? '#000' : (p.activeInTiebreaker ? '#fff' : '#666')) + '; ' +
                'font-weight: ' + (isCurrent ? 'bold' : 'normal') + '; ' +
                'border: 1px solid ' + (isCurrent ? '#1DB954' : '#383838') + ';';
            badge.innerText = p.name + ': ' + p.score;
            board.appendChild(badge);
        });
    };

    const showWinnerScreen = function(winner) {
        showScreen('winner');
        document.getElementById('winner-name').innerText = winner.name + ' gewinnt mit ' + winner.score + ' Punkten!';
        const standings = document.getElementById('final-standings');
        standings.innerHTML = '';
        const sorted = gameConfig.players.slice().sort(function(a, b) { return b.score - a.score; });
        sorted.forEach(function(p, idx) {
            const row = document.createElement('div');
            row.style.cssText = 'display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #282828; font-size: 15px;';
            row.innerHTML = '<span>' + (idx + 1) + '. ' + p.name + '</span><strong>' + p.score + ' Pkt.</strong>';
            standings.appendChild(row);
        });
    };

    document.getElementById('btn-restart').addEventListener('click', function() {
        audioPlayer.pause();
        showScreen('setup');
    });

    populatePlaylistDropdown(null);
    renderPlayerInputs();
})();
</script>
</body>
</html>
